<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mission Special BCS</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;700&display=swap">
<style>
:root{--bg:#f2f7f5;--card:#fff;--ink:#10231f;--mute:#5a6e69;--line:#cfdcd8;--pri:#0e6b5c;--on:#fff;--err:#b3261e}
@media (prefers-color-scheme:dark){:root{--bg:#0d1715;--card:#15231f;--ink:#e6f1ee;--mute:#9bb0aa;--line:#2a3d38;--pri:#3fbfa6;--on:#06201a;--err:#ff8a80}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:16px;background:var(--bg);color:var(--ink);font-family:"Hind Siliguri",system-ui,sans-serif;font-size:17px;line-height:1.6}
main{width:100%;max-width:400px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:28px 22px}
h1{margin:0 0 4px;font-size:26px}
p.sub{margin:0 0 22px;color:var(--mute)}
label{display:block;font-weight:500;margin:14px 0 4px}
input{width:100%;padding:12px;font:inherit;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:8px}
input:focus,button:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
button{font:inherit;cursor:pointer}
.main-btn{width:100%;margin-top:20px;padding:12px;font-weight:700;color:var(--on);background:var(--pri);border:0;border-radius:8px}
.link{background:none;border:0;padding:4px 0;color:var(--pri);text-decoration:underline}
.row{display:flex;justify-content:space-between;margin-top:14px;flex-wrap:wrap}
#msg{min-height:1.6em;margin:12px 0 0;color:var(--err)}
#msg.ok{color:var(--pri)}
.hidden{display:none}
main{max-width:560px}
h2{margin:0 0 6px;font-size:21px}
.q{border:1px solid var(--line);border-radius:10px;margin:14px 0;padding:10px 12px}
.q legend{font-weight:700;padding:0 6px}
.opt{display:flex;gap:8px;align-items:flex-start;margin:6px 0;font-weight:400;cursor:pointer}
.opt input{width:auto;margin-top:8px}
.bar{position:sticky;top:0;z-index:2;background:var(--card);padding:8px 0;display:flex;justify-content:space-between}
#clock{font-weight:700;color:var(--pri)}
.rv{border-left:4px solid;padding:6px 10px;margin:12px 0}
.rv.good{border-color:var(--pri)}
.rv.bad{border-color:var(--err)}
.rv span{color:var(--mute);font-size:15px}
</style>
</head>
<body>
<main>
  <h1>Mission Special BCS</h1>

  <section id="authView">
    <p class="sub" id="modeText">অ্যাকাউন্টে লগইন করুন</p>
    <label for="email">ইমেইল</label>
    <input id="email" type="email" autocomplete="email" inputmode="email">
    <label for="password">পাসওয়ার্ড (কমপক্ষে ৬ অক্ষর)</label>
    <input id="password" type="password" autocomplete="current-password">
    <button class="main-btn" id="submitBtn">লগইন করুন</button>
    <div class="row">
      <button class="link" id="toggleBtn">নতুন অ্যাকাউন্ট খুলুন</button>
      <button class="link" id="resetBtn">পাসওয়ার্ড ভুলে গেছেন?</button>
    </div>
  </section>

  <section id="homeView" class="hidden">
    <p class="sub">লগইন করা আছে: <strong id="userEmail"></strong></p>
    <div id="startBox">
      <h2>মডেল টেস্ট ১: জলবায়ু</h2>
      <p>১০টি প্রশ্ন · সময় ১০ মিনিট · প্রতিটিতে ৫টি অপশন (A–E)</p>
      <button class="main-btn" id="startBtn">টেস্ট শুরু করুন</button>
    </div>
    <div id="test" class="hidden">
      <div class="bar"><span>বাকি সময়: <span id="clock"></span></span></div>
      <div id="qs"></div>
      <button class="main-btn" id="submitTest">জমা দিন</button>
    </div>
    <div id="result" class="hidden"></div>
    <div class="row"><button class="link" id="logoutBtn">লগআউট</button></div>
  </section>

  <p id="msg" role="status"></p>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword,
  signOut, onAuthStateChanged, sendPasswordResetEmail }
  from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

/* ====== এখানে Firebase থেকে কপি করা firebaseConfig পেস্ট করুন ====== */
const firebaseConfig = {
  apiKey: "AIzaSyCT0MtyJKIjH8LgpJSD1UD96EKUenDwuR0",
  authDomain: "mission-special-bcs.firebaseapp.com",
  databaseURL: "https://mission-special-bcs-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "mission-special-bcs",
  storageBucket: "mission-special-bcs.firebasestorage.app",
  messagingSenderId: "223149788321",
  appId: "1:223149788321:web:8d022746694df2755c34e0",
  measurementId: "G-ZVF15GHN76"
};
/* ================================================================= */

const auth = getAuth(initializeApp(firebaseConfig));
const $ = id => document.getElementById(id);
let signup = false;

const errors = {
  "auth/invalid-email": "ইমেইল ঠিক নেই।",
  "auth/missing-password": "পাসওয়ার্ড লিখুন।",
  "auth/weak-password": "পাসওয়ার্ড কমপক্ষে ৬ অক্ষরের দিন।",
  "auth/email-already-in-use": "এই ইমেইলে অ্যাকাউন্ট আছে। লগইন করুন।",
  "auth/invalid-credential": "ইমেইল বা পাসওয়ার্ড ভুল।",
  "auth/user-not-found": "এই ইমেইলে অ্যাকাউন্ট নেই।",
  "auth/too-many-requests": "অনেকবার চেষ্টা হয়েছে। কিছুক্ষণ পরে আবার দিন।",
  "auth/network-request-failed": "ইন্টারনেট সংযোগ পরীক্ষা করুন।",
  "auth/unauthorized-domain": "এই ডোমেইন Firebase-এর Authorized domains-এ যোগ করুন।"
};
const say = (t, ok) => { $("msg").textContent = t; $("msg").className = ok ? "ok" : ""; };

$("toggleBtn").onclick = () => {
  signup = !signup;
  $("modeText").textContent = signup ? "নতুন অ্যাকাউন্ট খুলুন" : "অ্যাকাউন্টে লগইন করুন";
  $("submitBtn").textContent = signup ? "অ্যাকাউন্ট খুলুন" : "লগইন করুন";
  $("toggleBtn").textContent = signup ? "আগে থেকেই অ্যাকাউন্ট আছে" : "নতুন অ্যাকাউন্ট খুলুন";
  $("password").autocomplete = signup ? "new-password" : "current-password";
  say("");
};

$("submitBtn").onclick = async () => {
  const email = $("email").value.trim(), pass = $("password").value;
  say("অপেক্ষা করুন…", true);
  try {
    if (signup) await createUserWithEmailAndPassword(auth, email, pass);
    else await signInWithEmailAndPassword(auth, email, pass);
    say("");
  } catch (e) { say(errors[e.code] || "কিছু একটা সমস্যা হয়েছে। আবার চেষ্টা করুন।"); }
};

$("resetBtn").onclick = async () => {
  const email = $("email").value.trim();
  if (!email) return say("আগে ইমেইল লিখুন।");
  try { await sendPasswordResetEmail(auth, email); say("পাসওয়ার্ড রিসেটের লিংক ইমেইলে পাঠানো হয়েছে।", true); }
  catch (e) { say(errors[e.code] || "লিংক পাঠানো যায়নি।"); }
};

const Q = [
{q:"বাংলাদেশের জলবায়ু কোন ধরনের?",o:["মরু","ভূমধ্যসাগরীয়","ক্রান্তীয় মৌসুমি","নাতিশীতোষ্ণ","মেরু"],a:2,e:"বাংলাদেশ ক্রান্তীয় অঞ্চলে অবস্থিত এবং মৌসুমি বায়ুর প্রভাবে ঋতুভেদে বৃষ্টি ও তাপমাত্রা বদলায়।"},
{q:"বাংলাদেশে সবচেয়ে বেশি বৃষ্টিপাত হয় কোন ঋতুতে?",o:["গ্রীষ্ম","শীত","শরৎ","বসন্ত","বর্ষা"],a:4,e:"দক্ষিণ-পশ্চিম মৌসুমি বায়ুর কারণে জুন থেকে সেপ্টেম্বরে বছরের বেশির ভাগ বৃষ্টি হয়।"},
{q:"কর্কটক্রান্তি রেখা কত অক্ষাংশে অবস্থিত?",o:["০°","৬৬.৫° উত্তর","৯০° উত্তর","২৩.৫° দক্ষিণ","২৩.৫° উত্তর"],a:4,e:"কর্কটক্রান্তি ২৩.৫° উত্তর অক্ষাংশে; এটি বাংলাদেশের মধ্য দিয়ে গেছে।"},
{q:"বর্ষাকালে বাংলাদেশে বৃষ্টি আনে কোন বায়ু?",o:["উত্তর-পূর্ব মৌসুমি বায়ু","দক্ষিণ-পশ্চিম মৌসুমি বায়ু","পশ্চিমা বায়ু","মেরু বায়ু","স্থল বায়ু"],a:1,e:"বঙ্গোপসাগর থেকে আসা আর্দ্র দক্ষিণ-পশ্চিম মৌসুমি বায়ু বৃষ্টি আনে; শীতে উত্তর-পূর্ব মৌসুমি বায়ু শুষ্ক থাকে।"},
{q:"কালবৈশাখী ঝড় কোন সময়ে বেশি হয়?",o:["গ্রীষ্ম (প্রাক-বর্ষা)","বর্ষা","শীত","শরৎ","হেমন্ত"],a:0,e:"চৈত্র-বৈশাখ মাসে বজ্রসহ এই ঝড় হয়।"},
{q:"বাংলাদেশে সবচেয়ে বেশি বৃষ্টিপাত হয় কোন অঞ্চলে?",o:["রাজশাহী","খুলনা","বরিশাল","সিলেট","রংপুর"],a:3,e:"উত্তর-পূর্বের সিলেট অঞ্চল পাহাড় ঘেঁষা, তাই সর্বাধিক বৃষ্টি হয়। সবচেয়ে কম বৃষ্টি রাজশাহী অঞ্চলে।"},
{q:"বৈশ্বিক উষ্ণায়নে মানবসৃষ্ট গ্রিনহাউস গ্যাসগুলোর মধ্যে সবচেয়ে বেশি অবদান কোনটির?",o:["মিথেন","নাইট্রাস অক্সাইড","কার্বন ডাই-অক্সাইড","ওজোন","সিএফসি"],a:2,e:"জীবাশ্ম জ্বালানি পোড়ানো থেকে নির্গত কার্বন ডাই-অক্সাইড সবচেয়ে বড় অবদান রাখে।"},
{q:"প্যারিস চুক্তিতে শিল্পবিপ্লব-পূর্ব স্তরের তুলনায় তাপমাত্রা বৃদ্ধি সীমিত রাখার প্রচেষ্টার লক্ষ্যমাত্রা কত?",o:["০.৫°C","১.৫°C","১°C","৩°C","৪°C"],a:1,e:"২০১৫ সালের প্যারিস চুক্তিতে ২°C-এর অনেক নিচে রাখা এবং ১.৫°C-এ সীমিত রাখার চেষ্টার লক্ষ্য আছে।"},
{q:"কিয়োটো প্রোটোকল (১৯৯৭) কোন বিষয়ের সাথে সম্পর্কিত?",o:["ওজোন স্তর রক্ষা","জীববৈচিত্র্য সংরক্ষণ","জলাভূমি সংরক্ষণ","মরুকরণ রোধ","গ্রিনহাউস গ্যাস নিঃসরণ হ্রাস"],a:4,e:"কিয়োটো প্রোটোকল গ্রিনহাউস গ্যাস কমানোর চুক্তি। ওজোন স্তর রক্ষার চুক্তি ১৯৮৭ সালের মন্ট্রিল প্রটোকল।"},
{q:"আইপিসিসি (IPCC) কত সালে প্রতিষ্ঠিত হয়?",o:["১৯৭২","১৯৯২","১৯৮৮","১৯৯৭","২০১৫"],a:2,e:"WMO ও UNEP ১৯৮৮ সালে জলবায়ু পরিবর্তন বিষয়ক আন্তঃসরকার প্যানেল (IPCC) গঠন করে।"}
];
const L = "ABCDE";
let timer, left = 600;

function tick() {
  $("clock").textContent = String(Math.floor(left / 60)).padStart(2, "0") + ":" + String(left % 60).padStart(2, "0");
  if (left <= 0) return finish();
  left--;
}
function startTest() {
  clearInterval(timer);
  left = 600;
  $("startBox").classList.add("hidden");
  $("result").classList.add("hidden");
  $("test").classList.remove("hidden");
  $("qs").innerHTML = Q.map((x, i) =>
    `<fieldset class="q"><legend>${i + 1}. ${x.q}</legend>` +
    x.o.map((t, j) => `<label class="opt"><input type="radio" name="q${i}" value="${j}"> <span>${L[j]}. ${t}</span></label>`).join("") +
    `</fieldset>`).join("");
  window.scrollTo(0, 0);
  tick();
  timer = setInterval(tick, 1000);
}
function finish() {
  clearInterval(timer);
  let score = 0;
  const rev = Q.map((x, i) => {
    const c = document.querySelector(`input[name="q${i}"]:checked`);
    const p = c ? +c.value : -1;
    if (p === x.a) score++;
    return `<div class="rv ${p === x.a ? "good" : "bad"}"><b>${i + 1}. ${x.q}</b><br>আপনার উত্তর: ${p < 0 ? "দেননি" : L[p]}। সঠিক উত্তর: ${L[x.a]}. ${x.o[x.a]}<br><span>${x.e}</span></div>`;
  }).join("");
  $("test").classList.add("hidden");
  $("result").innerHTML = `<h2>স্কোর: ${score}/${Q.length}</h2>${rev}<button class="main-btn" id="again">আবার দিন</button>`;
  $("result").classList.remove("hidden");
  $("again").onclick = startTest;
  window.scrollTo(0, 0);
}
$("startBtn").onclick = startTest;
$("submitTest").onclick = finish;
$("logoutBtn").onclick = () => { clearInterval(timer); signOut(auth); };

onAuthStateChanged(auth, user => {
  $("authView").classList.toggle("hidden", !!user);
  $("homeView").classList.toggle("hidden", !user);
  if (user) $("userEmail").textContent = user.email;
});
</script>
</body>
</html>
